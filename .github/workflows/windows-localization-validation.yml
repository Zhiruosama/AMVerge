name: Windows Localization Validation

on:
  push:
    branches:
      - codex/windows-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test Windows localization
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AMVERGE_CLI_INSTALL_SPEC: "amverge[edge,discord,dev]==1.3.3"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check translations and language preferences
        working-directory: frontend
        run: npm run check:i18n

      - name: Check import failure and cancellation handling
        working-directory: frontend
        run: npm run check:import

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Stage FFmpeg binaries
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpegDir = Join-Path (Get-Location) "frontend/.ffmpeg-bin"
          New-Item -ItemType Directory -Force $ffmpegDir | Out-Null
          $installed = "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin"
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = Join-Path $installed $name
            if (-not (Test-Path $source)) { throw "Missing $source" }
            Copy-Item $source (Join-Path $ffmpegDir $name) -Force
          }
          "FFMPEG_BIN_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bundled CLI
        working-directory: frontend
        run: npm run build:sidecar

      - name: Import a video through the Windows sidecar
        working-directory: frontend
        run: npm run check:sidecar

      - name: Stage uv
        working-directory: frontend
        run: npm run fetch:uv

      - name: Run Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --bin amverge

      - name: Build Windows beta installer
        working-directory: frontend
        shell: pwsh
        run: |
          $config = @{
            build = @{ beforeBuildCommand = $null }
            bundle = @{ createUpdaterArtifacts = $false }
          } | ConvertTo-Json -Depth 5
          $configPath = Join-Path $env:RUNNER_TEMP "amverge-windows-validation.json"
          [System.IO.File]::WriteAllText($configPath, $config, [System.Text.UTF8Encoding]::new($false))
          npm exec -- tauri build --config src-tauri/tauri.beta.conf.json --config $configPath --bundles nsis --ci

      - name: Upload Windows beta installer
        uses: actions/upload-artifact@v4
        with:
          name: AMVerge-2.0.2-zh-CN-Windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
